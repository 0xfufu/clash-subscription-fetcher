<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费Clash订阅获取器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .button-container {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stop-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            margin-top: 15px;
        }

        .stop-btn:hover {
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.4);
        }

        .copy-btn {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            padding: 8px 20px;
            font-size: 14px;
            margin-left: 10px;
            border-radius: 20px;
        }

        .copy-btn:hover {
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .url-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .url-text {
            flex: 1;
            word-break: break-all;
            color: #333;
            font-size: 16px;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-item {
            margin-bottom: 15px;
        }

        .result-item label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .result-item .value {
            color: #333;
            font-size: 16px;
            word-break: break-all;
        }

        .result-item .value a {
            color: #667eea;
            text-decoration: none;
        }

        .result-item .value a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            color: #666;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .error {
            color: #e74c3c;
            background: #fee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>免费Clash订阅获取器</h1>

        <div class="button-container">
            <button id="fetchBtn" onclick="fetchSubscription()">获取最新免费订阅</button>
            <button id="stopBtn" onclick="stopServer()" class="stop-btn">停止服务</button>
        </div>

        <div class="loading" id="loading">
            正在获取数据...
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-item">
                <label>标题</label>
                <div class="value" id="title"></div>
            </div>
            <div class="result-item">
                <label>最新检测时间</label>
                <div class="value" id="date"></div>
            </div>
            <div class="result-item">
                <label>Clash / Mihomo 订阅地址</label>
                <div class="value url-container">
                    <span class="url-text" id="subscriptionUrl"></span>
                    <button class="copy-btn" onclick="copySubscriptionUrl()">复制</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchSubscription() {
            const btn = document.getElementById('fetchBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            btn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');
            result.classList.remove('show');

            try {
                const response = await fetch('/api/scrape');
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                document.getElementById('title').textContent = data.title || '未找到';
                document.getElementById('date').textContent = data.date || '未找到';
                document.getElementById('subscriptionUrl').textContent = data.subscriptionUrl || '未找到';

                result.classList.add('show');
            } catch (err) {
                error.textContent = '错误: ' + err.message;
                error.classList.add('show');
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }

        async function stopServer() {
            if (confirm('确定要停止服务吗？')) {
                try {
                    await fetch('/api/stop');
                    window.close();
                } catch (err) {
                    console.error('Stop error:', err);
                }
            }
        }

        async function copySubscriptionUrl() {
            const urlText = document.getElementById('subscriptionUrl').textContent;
            if (urlText && urlText !== '未找到') {
                try {
                    await navigator.clipboard.writeText(urlText);
                    alert('已复制到剪贴板');
                } catch (err) {
                    // Fallback for older browsers
                    const textarea = document.createElement('textarea');
                    textarea.value = urlText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('已复制到剪贴板');
                }
            }
        }
    </script>
</body>
</html>
